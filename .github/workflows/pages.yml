name: pages

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The hosted page: /?hash=… (site/index.html), the bundle under /dist/, the demo under /demo/.
      - run: |
          mkdir -p _site/dist
          cp packages/widget/site/index.html _site/index.html
          cp packages/widget/dist/nactrace.js packages/widget/dist/nactrace.js.map _site/dist/
          cp -r packages/widget/demo _site/demo
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
