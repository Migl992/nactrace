name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # npm publishing stays manual (a second factor is required on every publish).
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packages/widget/dist/nactrace.js
            packages/widget/dist/nactrace.js.map
